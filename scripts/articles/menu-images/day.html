<!doctype html><html><head><meta charset="utf-8"><title>Day image render 1024×1536</title><style>
/* One day image as rendered by render.mjs, which calls render(data) through CDP. Photos live in src/. */
*{margin:0;box-sizing:border-box}
html,body{width:1024px;height:1536px;overflow:hidden}
body{position:relative;background:0 0/1024px 1536px no-repeat;font-family:"Iowan Old Style",Palatino,Georgia,serif;color:#4a4038}
.hd{position:absolute;left:0;right:0;text-align:center}
.hd h1{font-size:80px;font-weight:400;color:#8a6a55;letter-spacing:.5px}.hd h1 span{color:#6f8a74}
.hd p{font-size:30px;color:#7a6e64;margin-top:8px}.hd .k{color:#4a4038;margin-top:4px}
.c{position:absolute;display:flex;flex-direction:column;overflow:hidden;font-size:calc(21px * var(--s,1));hyphens:auto}
.c h2{font-size:1em;font-weight:600;letter-spacing:1.5px;color:#9a6e52;text-transform:uppercase;margin-bottom:.5em;line-height:1.2}
.c p{line-height:1.3}
.c b{font-weight:400;font-size:1.4em;margin:auto 0 .3em}
.c small{font-size:.82em;line-height:1.45;color:#6b625a}
.top .hd h1{font-size:64px}.top .hd p{font-size:27px;margin-top:2px}
.top .c b{margin:.35em 0 .15em}
.t{position:absolute;left:78px;right:78px;display:flex;align-items:center;gap:40px}
.t h2{font-size:21px;font-weight:600;letter-spacing:2px;color:#9a6e52;text-transform:uppercase;width:180px;line-height:1.3}
.t .kc{font-size:40px;white-space:nowrap}
.t ul{list-style:none;font-size:22px;line-height:1.55;padding:0}
.c.w{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;column-gap:16px;align-content:start}
.c.w h2{grid-area:1/1;margin-bottom:.3em}.c.w p{grid-area:2/1}.c.w b,.top .c.w b{grid-area:1/2;margin:0}.c.w small{grid-area:2/2}
.t.tb{height:auto;gap:36px;padding:0 6px}.t.tb ul{font-size:20px;line-height:1.4}.t.tb.col{flex-direction:column;align-items:flex-start;justify-content:center;gap:8px}.t.tb.tight ul{font-size:18px;line-height:1.3}.t.tb.tight .kc{font-size:36px}
.c.nofit{outline:4px dashed #e5484d;outline-offset:4px}
#flag{position:absolute;left:0;right:0;bottom:0;background:#e5484d;color:#fff;font:700 24px/1.3 system-ui,sans-serif;padding:14px 24px}
</style></head><body>
<div class="hd" id="hd"><h1 id="h1"></h1><p id="sub"></p><p class="k" id="k"></p></div>
<div id="cards"></div>
<div id="patch" style="position:absolute;display:none"></div>
<div class="t" id="t"></div>
<div id="flag" hidden></div>
<script>
// Geometry: x, y, w, h of the empty text area of each card (measured on each delivered photo), plus header top and
// totals card [top, bottom-offset] (the totals row is centred on the photo's totals card). cls 'top' = text above the food.
const G={6:{
 monday:{cls:'',hd:70,boxes:[[66,362,190,392],[552,362,185,392],[66,840,180,392],[552,840,210,392]],t:[1318,62]},
 tuesday:{cls:'top',hd:28,boxes:[[56,268,420,196],[554,268,420,196],[56,782,420,186],[554,782,420,186]],t:[1262,64]},
 // photo left, text right: strip right of each bottle or bowl
 wednesday:{cls:'',hd:76,boxes:[[262,352,234,424],[802,352,172,424],[330,820,166,420],[724,822,248,415]],t:[1315,93]},
 thursday:{cls:'top',hd:40,boxes:[[62,272,430,190],[538,272,430,190],[62,790,430,170],[538,790,430,170]],t:[1300,98]},
 // photo right, text left
 friday:{cls:'',hd:50,boxes:[[32,312,252,368],[534,312,190,372],[32,718,200,362],[534,718,255,362]],t:[1150,160]},
 // photo left half, text right half
 saturday:{cls:'',hd:70,boxes:[[274,326,222,418],[762,326,226,418],[274,786,222,404],[762,786,226,404]],t:[1290,126]},
 sunday:{cls:'top',hd:24,boxes:[[34,244,458,162],[534,244,458,230],[34,778,458,222],[534,778,458,218]],t:[1330,96]}},
// 8 months: 6 cards + a full-width totals card; t = [top, bottom-offset] of that card (measured on each photo).
8:{
 monday:{cls:'',hd:45,boxes:[[30,303,192,276],[540,303,186,276],[30,643,191,275],[540,643,186,275],[30,980,193,271],[540,980,186,271]],t:[1291,23]},
 tuesday:{cls:'top',hd:40,boxes:[[53,258,426,125],[545,258,426,125],[53,629,426,104],[545,629,426,104],[53,974,426,106],[545,974,426,106]],t:[1327,38]},
 wednesday:{cls:'',hd:60,boxes:[[292,315,200,273],[808,315,186,273],[296,647,196,254],[808,647,186,254],[296,961,196,259],[808,961,186,259]],t:[1260,29]},
 thursday:{cls:'top',hd:36,boxes:[[46,262,435,127],[543,262,435,128],[46,662,435,98],[543,662,435,98],[46,1011,435,104],[543,1011,435,104]],t:[1360,20]},
 friday:{cls:'',hd:40,boxes:[[40,288,262,279],[538,288,207,279],[40,626,187,264],[538,626,193,264],[40,947,163,266],[538,947,237,266]],t:[1252,42]},
 saturday:{cls:'',hd:100,boxes:[[301,378,191,243],[794,378,196,243],[301,687,191,245],[794,687,196,245],[301,999,191,246],[794,999,196,246]],t:[1291,40]},
 sunday:{cls:'top',hd:36,boxes:[[36,236,455,97],[533,236,455,97],[36,601,455,98],[533,601,455,98],[36,964,455,97],[533,964,455,97]],t:[1325,20]}}};
// 7-month geometry (measured on src/menu_7_months_<day>.png): same fields; t = [x,y,w,h,col?]: totals text box inside the totals card
// (col = totals is a half-width 6th card, stacked). Tue/Thu/Sun: text in the light top part of each card; Mon/Wed/Fri/Sat: text beside the photo.
const G7={
 monday:{cls:'',hd:70,boxes:[[38,304,214,292],[538,304,200,292],[38,646,206,296],[538,646,206,296],[38,990,256,236]],t:[48,1266,910,205],bg:'#f3eee6'},
 tuesday:{cls:'top',hd:24,boxes:[[38,262,450,150],[538,262,450,150],[38,703,450,148],[538,703,450,148],[38,1127,450,148]],t:[546,1135,440,365,1],bg:'#e5ece2'},
 wednesday:{cls:'',hd:50,boxes:[[272,284,222,304],[780,284,216,304],[272,632,222,296],[780,632,216,296],[272,967,222,292]],t:[48,1302,910,190],bg:'#f3e6e6',patch:[512,944,512,336]},
 thursday:{cls:'top',hd:34,boxes:[[44,250,448,164],[540,250,448,164],[44,775,448,150],[540,775,448,150],[338,1186,152,320]],t:[544,1185,440,325,1],bg:'#e2ebf2'},
 friday:{cls:'',hd:50,boxes:[[30,300,284,280],[536,300,172,280],[30,618,180,286],[536,618,174,286],[30,945,284,272]],t:[48,1264,910,220],bg:'#f6eed6'},
 saturday:{cls:'',hd:18,boxes:[[270,305,226,306],[786,305,212,306],[292,664,204,288],[786,664,212,288],[326,1002,670,256]],t:[48,1306,910,196],bg:'#eef0eb'},
 sunday:{cls:'top',hd:24,boxes:[[338,243,150,350],[540,243,448,150],[36,653,448,138],[540,653,448,138],[338,1063,150,298]],t:[48,1405,910,85,0,1],bg:'#ebe8ef'}};
// Per locale: day names, title template, subtitle, macro names, "Daily totals" label (kept from the approved design).
const L={
en:{d:{monday:'Monday',tuesday:'Tuesday',wednesday:'Wednesday',thursday:'Thursday',friday:'Friday',saturday:'Saturday',sunday:'Sunday'},h:d=>`${d} <span>Menu</span>`,s:a=>`— for a ${a}-month-old baby —`,m:['Carbs','Protein','Fat'],tt:'Daily totals'},
es:{d:{monday:'lunes',tuesday:'martes',wednesday:'miércoles',thursday:'jueves',friday:'viernes',saturday:'sábado',sunday:'domingo'},h:d=>`Menú del <span>${d}</span>`,s:a=>`— para un bebé de ${a} meses —`,m:['Carbohidratos','Proteínas','Grasas'],tt:'Totales del día'},
fr:{d:{monday:'lundi',tuesday:'mardi',wednesday:'mercredi',thursday:'jeudi',friday:'vendredi',saturday:'samedi',sunday:'dimanche'},h:d=>`Menu du <span>${d}</span>`,s:a=>`— pour un bébé de ${a} mois —`,m:['Glucides','Protéines','Lipides'],tt:'Totaux de la journée'},
pt:{d:{monday:'segunda',tuesday:'terça',wednesday:'quarta',thursday:'quinta',friday:'sexta',saturday:'sábado',sunday:'domingo'},h:d=>`Cardápio de <span>${d}</span>`,s:a=>`— para um bebê de ${a} meses —`,m:['Carboidratos','Proteínas','Gorduras'],tt:'Totais do dia'},
it:{d:{monday:'lunedì',tuesday:'martedì',wednesday:'mercoledì',thursday:'giovedì',friday:'venerdì',saturday:'sabato',sunday:'domenica'},h:d=>`Menù di <span>${d}</span>`,s:a=>`— per un bambino di ${a} mesi —`,m:['Carboidrati','Proteine','Grassi'],tt:'Totali giornalieri'},
de:{d:{monday:'Montag',tuesday:'Dienstag',wednesday:'Mittwoch',thursday:'Donnerstag',friday:'Freitag',saturday:'Samstag',sunday:'Sonntag'},h:d=>`Speiseplan <span>${d}</span>`,s:a=>`— für ein Baby mit ${a} Monaten —`,m:['Kohlenhydrate','Eiweiß','Fett'],tt:'Tagesgesamt'}};
// render.mjs calls render(data); data comes from the locale's 6-month page:
// {lang, age, day, kcal, meals:[{label,text,kcal,macros:[c,p,f]}], tot:['Carbs 81 g (50%)',...]}. Returns {bad:[labels that do not fit]}.
const keep=s=>s.replace(/ (?=(g|ml)\b)/g,' ').replace(/ × /g,' × ').replace(/ :/g,' :'); // never split "60 g" or "4 × 150"
window.render=async data=>{
const {lang,day,age}=data, g=(age===7?G7:G[age])[day], d=L[lang];
document.documentElement.lang=lang;
const bg=`src/menu_${age}_months_${day}.png`;
await new Promise((ok,no)=>{const im=new Image();im.onload=ok;im.onerror=()=>no(new Error('missing '+bg));im.src=bg;});
document.body.style.backgroundImage=`url(${bg})`; document.body.className=g.cls; document.body.style.backgroundColor=age===7?g.bg:''; // 7 m: some PNGs have alpha, keep a pale base
await document.fonts.ready;
hd.style.top=g.hd+'px'; h1.innerHTML=d.h(d.d[day]); sub.textContent=d.s(age); k.textContent='~'+data.kcal+' kcal';
// Wed 7 m: semi-transparent dark smudge right of card 5 -> cover with the page tone
const pa=age===7&&g.patch;patch.style.display=pa?'block':'none';if(pa)Object.assign(patch.style,{left:pa[0]+'px',top:pa[1]+'px',width:pa[2]+'px',height:pa[3]+'px',background:g.bg});
const wide=g.cls==='top'&&age===8, stacked=g.cls!=='top'||wide; // 8 months: the text band above the food is only ~85-125 px tall, so label+text sit left of kcal+macros
cards.innerHTML=g.boxes.map(([x,y,w,h],i)=>{const m=data.meals[i];return `<div class="c${wide?' w':''}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><h2>${m.label}</h2><p>${keep(m.text)}</p><b>~${m.kcal} kcal</b><small>${m.macros.map((v,j)=>d.m[j]+' '+v+' g').join(stacked?'<br>':' · ')}</small></div>`;}).join('');
if(age===7){const [x,y,w,h,col,tight]=g.t;t.className='t tb'+(col?' col':'')+(tight?' tight':'');Object.assign(t.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',right:'auto',bottom:'auto'});}
else{t.className='t';Object.assign(t.style,{left:'',width:'',height:'',right:'',top:g.t[0]+'px',bottom:g.t[1]+'px'});}
t.innerHTML=`<h2>${d.tt}</h2><div class="kc">~${data.kcal} kcal</div><ul>${data.tot.map(v=>`<li>${v}</li>`).join('')}</ul>`;
// Fit rule: shrink a card's text down to 15 px (from 21); if it still overflows, mark it and send the image back.
const bad=[], small=[]; flag.hidden=true;
document.querySelectorAll('.c').forEach((c,i)=>{for(let s=1;s>=15/21;s-=.02){c.style.setProperty('--s',s);if(c.scrollHeight<=c.clientHeight&&c.scrollWidth<=c.clientWidth){if(s*21<17)small.push(data.meals[i].label+' '+Math.round(s*21)+'px');return;}}c.classList.add('nofit');bad.push(data.meals[i].label);});
if(bad.length){flag.hidden=false;flag.textContent='No cabe ni a 15 px: '+bad.join(', ')+' → esta imagen vuelve a Unai para regenerarla con más hueco';}
return {bad,small};};
</script></body></html>
