  <text x="608" y="700" text-anchor="middle" font-size="40" font-weight="800" fill="#2e6f5c" letter-spacing="3">UNTEN</text>
  <!-- numbers over the image's empty circles (r 41 covers the drawn ring): order of eruption, 1 = first -->
  <g font-size="40" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="#163b31" stroke-width="0">
    <g stroke="#5a5a5a" stroke-width="3">
      <!-- upper arch, left to right: m2 m1 c l ce | ce l c m1 m2 -->
      <circle cx="95" cy="457" r="41" fill="#c9b8f0"/>
      <circle cx="176" cy="276" r="41" fill="#ffd27a"/>
      <circle cx="295" cy="179" r="41" fill="#ffb59a"/>
      <circle cx="412" cy="109" r="41" fill="#a6e0cc"/>
      <circle cx="539" cy="66" r="41" fill="#57bfa3"/>
