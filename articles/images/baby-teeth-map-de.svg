      <circle cx="811" cy="109" r="41" fill="#a6e0cc"/>
      <circle cx="924" cy="179" r="41" fill="#ffb59a"/>
      <circle cx="1043" cy="276" r="41" fill="#ffd27a"/>
      <circle cx="1127" cy="457" r="41" fill="#c9b8f0"/>
      <!-- lower arch, left to right -->
      <circle cx="91" cy="879" r="41" fill="#c9b8f0"/>
      <circle cx="185" cy="1046" r="41" fill="#ffd27a"/>
      <circle cx="308" cy="1149" r="41" fill="#ffb59a"/>
      <circle cx="425" cy="1199" r="41" fill="#a6e0cc"/>
      <circle cx="544" cy="1232" r="41" fill="#57bfa3"/>
      <circle cx="671" cy="1232" r="41" fill="#57bfa3"/>
      <circle cx="787" cy="1199" r="41" fill="#a6e0cc"/>
      <circle cx="907" cy="1149" r="41" fill="#ffb59a"/>
      <circle cx="1032" cy="1046" r="41" fill="#ffd27a"/>
      <circle cx="1127" cy="879" r="41" fill="#c9b8f0"/>
    </g>
    <text x="95" y="457">7</text><text x="176" y="276">5</text><text x="295" y="179">6</text><text x="412" y="109">3</text><text x="539" y="66">2</text>
    <text x="683" y="66">2</text><text x="811" y="109">3</text><text x="924" y="179">6</text><text x="1043" y="276">5</text><text x="1127" y="457">7</text>
