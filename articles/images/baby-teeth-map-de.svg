<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1217 1293" width="1217" height="1293" font-family="Manrope, Arial, sans-serif">
  <!-- drawing (arcadas.png) goes behind as CSS background: an SVG shown via <img> cannot load external images -->
